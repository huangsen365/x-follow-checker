<div class="section">

  <div class="buttons">
    <button onclick="downloadSVG('square')">Download SVG (Square)</button>
    <button onclick="downloadSVG('rounded')">Download SVG (Rounded)</button>
  </div>
  <div class="buttons">
    <button onclick="downloadPNG(16)">PNG 16×16</button>
    <button onclick="downloadPNG(48)">PNG 48×48</button>
    <button onclick="downloadPNG(128)">PNG 128×128</button>
    <button onclick="downloadPNG(256)">PNG 256×256</button>
    <button onclick="downloadPNG(512)">PNG 512×512</button>
  </div>
  <p class="hint">
    Color layout: Top-left <span style="color:#FF3B30">Red</span> · Top-right <span style="color:#FFCC00">Yellow</span> · Bottom-left <span style="color:#007AFF">Blue</span> · Bottom-right <span style="color:#34C759">Green</span>
  </p>

<script>
function makeSVG(rounded) {
  const rx = rounded ? ' rx="96"' : '';
  const clipOpen = rounded ? `<clipPath id="rc"><rect width="512" height="512" rx="96"/></clipPath>` : '';
  const gOpen = rounded ? '<g clip-path="url(#rc)">' : '<g>';
  const gClose = '</g>';
  return `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    ${clipOpen}
    <clipPath id="tl"><rect x="0" y="0" width="256" height="256"/></clipPath>
    <clipPath id="tr"><rect x="256" y="0" width="256" height="256"/></clipPath>
    <clipPath id="bl"><rect x="0" y="256" width="256" height="256"/></clipPath>
    <clipPath id="br"><rect x="256" y="256" width="256" height="256"/></clipPath>
  </defs>
  ${gOpen}
    <rect width="512" height="512" fill="#000"${rx}/>
    <g clip-path="url(#tl)"><polygon points="96,40 152,40 416,472 360,472" fill="#FF3B30"/><polygon points="360,40 416,40 152,472 96,472" fill="#FF3B30"/></g>
    <g clip-path="url(#tr)"><polygon points="96,40 152,40 416,472 360,472" fill="#FFCC00"/><polygon points="360,40 416,40 152,472 96,472" fill="#FFCC00"/></g>
    <g clip-path="url(#bl)"><polygon points="96,40 152,40 416,472 360,472" fill="#007AFF"/><polygon points="360,40 416,40 152,472 96,472" fill="#007AFF"/></g>
    <g clip-path="url(#br)"><polygon points="96,40 152,40 416,472 360,472" fill="#34C759"/><polygon points="360,40 416,40 152,472 96,472" fill="#34C759"/></g><text x="256" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="384" font-weight="900" fill="#FFF" stroke="rgba(255,255,255,0.3)" stroke-width="16" stroke-linejoin="round" paint-order="stroke">?</text>
  ${gClose}
</svg>`;
}

function downloadSVG(type) {
  const svg = makeSVG(type === 'rounded');
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `x-follow-checker-logo-${type}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadPNG(size) {
  const svg = makeSVG(false);
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `icon${size}.png`;
    a.click();
  };
  img.src = url;
}
</script>
