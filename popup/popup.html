<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Follow Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title" data-i18n="appTitle">X Follow Checker</h1>
      <select id="langSelect" class="lang-select">
        <option value="en">EN</option>
        <option value="zh">简中</option>
        <option value="zh-TW">繁中</option>
      </select>
    </header>

    <div class="content">
      <!-- Input Section -->
      <section class="input-section">
        <div class="input-wrapper">
          <div class="input-row">
            <div class="input-group">
              <span class="input-prefix">@</span>
              <input
                type="text"
                id="screenNameInput"
                class="screen-name-input"
                placeholder="your_X_username"
                autocomplete="off"
              >
              <button id="clearInputBtn" type="button" class="input-clear" aria-label="Clear username">×</button>
            </div>
            <!-- Detect button temporarily hidden due to bugs - will fix later -->
            <button id="detectBtn" class="btn btn-detect hidden" data-i18n="detectUsername">Detect</button>
          </div>
          <!-- Recent Usernames Dropdown -->
          <div id="recentDropdown" class="recent-dropdown hidden">
            <div class="recent-header" data-i18n="recentUsernames">Recent</div>
            <div id="recentList" class="recent-list">
              <!-- Recent usernames rendered here -->
            </div>
            <button id="clearHistoryBtn" class="btn-clear" data-i18n="clearHistory">Clear History</button>
          </div>
        </div>
        <!-- Detect Error Tip -->
        <div id="detectTip" class="detect-tip hidden"></div>
        <button id="startBtn" class="btn btn-primary">
          <span class="btn-text" data-i18n="startCheck">Start Check</span>
          <span class="btn-loading hidden">
            <span class="spinner"></span>
            <span data-i18n="checking">Checking...</span>
          </span>
        </button>
      </section>

      <!-- Progress Section -->
      <section id="progressSection" class="progress-section hidden">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">Loading...</p>
      </section>

      <!-- Error Section -->
      <section id="errorSection" class="error-section hidden">
        <div class="error-icon">⚠️</div>
        <h3 id="errorTitle" class="error-title">Error</h3>
        <p id="errorMessage" class="error-message"></p>
        <p id="errorHint" class="error-hint hidden"></p>
        <div class="error-buttons">
          <button id="errorActionBtn" class="btn btn-secondary hidden"></button>
          <button id="reportIssueBtn" class="btn btn-link hidden" data-i18n="reportIssue">Report Issue</button>
        </div>
      </section>

      <!-- Results Section -->
      <section id="resultsSection" class="results-section hidden">
        <!-- Limit Warning -->
        <div id="limitWarning" class="limit-warning hidden">
          <span id="limitWarningText" data-i18n="limitReached"></span>
          <div class="limit-actions">
            <button id="continueCheckBtn" class="btn btn-continue" data-i18n="continueCheck">Continue to Check</button>
            <a id="limitWarningLink" href="#" target="_blank" data-i18n="requestMoreQuota"></a>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats">
          <div class="stat-item" data-filter="all" role="button" tabindex="0">
            <span class="stat-value" id="totalCount">0</span>
            <span class="stat-label" data-i18n="following">Following</span>
          </div>
          <div class="stat-item stat-mutual" data-filter="mutual" role="button" tabindex="0">
            <span class="stat-value" id="mutualCount">0</span>
            <span class="stat-label" data-i18n="mutual">Mutual</span>
          </div>
          <div class="stat-item stat-not-following" data-filter="notFollowing" role="button" tabindex="0">
            <span class="stat-value" id="notFollowingCount">0</span>
            <span class="stat-label" data-i18n="notFollowingBack">Not Following Back</span>
          </div>
        </div>

        <!-- Export Buttons -->
        <div class="export-buttons">
          <button id="exportCsvBtn" class="btn btn-small" data-i18n="exportCSV">Export CSV</button>
          <button id="exportJsonBtn" class="btn btn-small" data-i18n="exportJSON">Export JSON</button>
          <button id="draftMessageBtn" class="btn btn-small btn-accent" data-i18n="draftMessage">Draft Message</button>
        </div>

        <!-- Draft Message Section -->
        <div id="draftSection" class="draft-section hidden">
          <div class="draft-header">
            <span data-i18n="draftMessage">Draft Message</span>
            <button id="closeDraftBtn" class="btn-close">×</button>
          </div>
          <p id="draftNotice" class="draft-notice"></p>
          <textarea id="draftTextarea" class="draft-textarea" rows="6"></textarea>
          <div class="draft-actions">
            <button id="copyMessageBtn" class="btn btn-primary">
              <span class="btn-copy-text" data-i18n="copyMessage">Copy Message</span>
            </button>
          </div>
          <div id="goPostHint" class="go-post-hint hidden"></div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all" data-i18n="all">All</button>
          <button class="filter-tab" data-filter="mutual" data-i18n="mutual">Mutual</button>
          <button class="filter-tab" data-filter="notFollowing" data-i18n="notFollowingBack">Not Following Back</button>
        </div>

        <!-- User List -->
        <div id="userList" class="user-list">
          <!-- Users will be rendered here -->
        </div>

        <!-- Last Check Info -->
        <p id="lastCheckInfo" class="last-check-info"></p>
      </section>

      <!-- Empty State -->
      <section id="emptyState" class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3 data-i18n="noResults">No results yet</h3>
        <p data-i18n="noResultsDesc">Click "Start Check" to scan your following list.</p>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <!-- Server Notification (always shown if available) -->
      <div id="serverNotification" class="server-notification hidden"></div>
      <div class="footer-row">
        <a href="https://github.com/huangsen365/x-follow-checker" target="_blank" class="github-link">
          <svg class="github-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <span data-i18n="viewOnGitHub">GitHub</span>
        </a>
        <button id="openSidePanelBtn" class="side-panel-link">
          <svg class="verified-icon" width="14" height="14" viewBox="0 0 22 22" fill="currentColor">
            <path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/>
          </svg>
          <span data-i18n="browseVerified">Browse Verified</span>
        </button>
        <span id="versionInfo" class="version-info">v1.0.0</span>
      </div>
      <a id="updateLink" class="update-link hidden" href="#" target="_blank">
        <span id="updateMessage"></span>
      </a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
